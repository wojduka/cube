<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>cube</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #2b2b2b;
      }
      body {
        display: grid;
        place-items: center;
        overflow: hidden;
      }
      canvas {
        background: #fff;
        width: min(100vw, calc(100vh * 16 / 9));
        height: min(100vh, calc(100vw * 9 / 16));
      }
    </style>
  </head>
  <body>
    <canvas id="stage" width="1280" height="720"></canvas>
    <script type="importmap">
      {
        "imports": {
          "@newkrok/nape-js": "./nape/index.js"
        }
      }
    </script>
    <script type="module" src="./main.js"></script>
  </body>
</html>
